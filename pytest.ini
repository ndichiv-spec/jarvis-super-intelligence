# pytest configuration for JARVIS tests
[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as full integration tests
    unit: marks tests as unit tests (fast, isolated)
    regression: marks tests as regression tests
    infrastructure: marks tests as infrastructure subsystem tests
    api: marks tests as API endpoint tests
    security: marks tests as security-related
    smoke: marks tests as smoke/health check tests
    live_provider: performs explicitly opted-in calls to configured external AI providers
