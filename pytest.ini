# pytest configuration for the Silverwing model-gateway / runtime test suite
[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -m "not integration"
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as full integration tests
    unit: marks tests as unit tests (fast, isolated)
    api: marks tests as API endpoint tests
    silverwing: marks Silverwing runtime/gateway tests
    brain: marks JARVIS BRAIN v1 runtime/gateway tests