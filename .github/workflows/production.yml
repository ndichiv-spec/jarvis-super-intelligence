name: JARVIS production images

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests and production import
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deployment/production/requirements-production.txt
      - run: python -m pip install -r deployment/production/requirements-production.txt pytest pytest-asyncio ruff
      - name: Check Python syntax
        run: |
          python -m py_compile tests/test_page.py
          python -m compileall -q jarvis_backend infrastructure silverwing-backend tests
      - name: Check collection without services
        run: >-
          python -m pytest --collect-only -q
          --ignore=tests/test_nvidia_provider.py
          --ignore=tests/test_nvidia.py
        env:
          JARVIS_TEST_MODE: "1"
          JARVIS_SECRET_KEY: test-only-key-not-used-for-production
          JARVIS_TEST_DATABASE_PATH: ${{ runner.temp }}/jarvis-collection.sqlite
      - name: Prevent new Ruff debt
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: python scripts/check_ruff_debt.py --base "$LINT_BASE" --committed
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: python -c "import jarvis_backend.main; print('FastAPI production entry point imported')"
        env:
          JARVIS_TEST_MODE: "1"
          JARVIS_SECRET_KEY: test-only-key-not-used-for-production
      - name: Validate fresh revisioned migrations
        run: python -c "from scripts.migrate_persistence import upgrade_schema, check_schema; upgrade_schema(); assert check_schema() == 0"
        env:
          JARVIS_TEST_MODE: "1"
          JARVIS_SECRET_KEY: test-only-key-not-used-for-production
      - name: Run backend and critical security regressions
        run: >
          python -m pytest -q -m "not integration"
          tests/test_celery_runtime.py
          tests/test_command_runtime_api.py
          tests/test_readiness.py
          tests/test_phase2_persistence.py
          tests/test_production_migrations.py
          tests/test_test_database_isolation.py
          tests/test_security_regression.py
          tests/test_sec1_security.py
          tests/test_auth_email_security.py
          tests/test_reliability_remediation.py
          tests/test_secret_leakage.py
          tests/test_alert_email_delivery.py
          tests/test_alert_external_delivery_api.py
          tests/test_alert_delivery_deployment_config.py
          tests/test_platform_identity.py
          tests/test_phase6_verification.py
          tests/test_oauth_framework.py
          tests/test_oauth_disconnect_route.py
          tests/test_extensions.py
          tests/test_prompt_injection.py
          tests/test_connectors.py
          tests/test_connector_truthfulness.py
          tests/test_github_connector.py
          tests/test_gmail_oauth_connector.py
          tests/test_search_navigation.py
          tests/test_sandbox_api.py
          tests/api/test_endpoints.py
          tests/infrastructure/test_security.py
        env:
          JARVIS_TEST_MODE: "1"
          JARVIS_SECRET_KEY: test-only-key-not-used-for-production
          JARVIS_TEST_DATABASE_PATH: ${{ runner.temp }}/jarvis-backend.sqlite
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          exit-code: "1"
          ignore-unfixed: true

  frontend:
    name: Frontend typecheck, lint, tests, and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Lint changed frontend source files
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        run: node scripts/check_frontend_lint_debt.mjs "$LINT_BASE"
        working-directory: .
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm test -- --run
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: ""
          NEXT_PUBLIC_API_URL: ""
          NEXT_PUBLIC_WS_URL: ""

  publish:
    name: Publish immutable OCI images
    needs: [backend, frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      build_time: ${{ steps.build-metadata.outputs.build_time }}
    steps:
      - uses: actions/checkout@v4
      - name: Record image build time
        id: build-metadata
        run: echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ndichiv-spec/jarvis-super-intelligence/backend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=JARVIS backend
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/production/Dockerfile.backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/metadata-action@v5
        id: frontend-meta
        with:
          images: ghcr.io/ndichiv-spec/jarvis-super-intelligence/frontend
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag
          labels: |
            org.opencontainers.image.title=JARVIS frontend
            org.opencontainers.image.revision=${{ github.sha }}
            org.jarvis.public-base-path=${{ vars.JARVIS_BASE_PATH || '/' }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend/web
          file: frontend/web/Dockerfile.frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_APP_URL=
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_WS_URL=
            NEXT_PUBLIC_BASE_PATH=${{ vars.JARVIS_BASE_PATH || '/' }}
            NEXT_PUBLIC_APP_VERSION=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ndichiv-spec/jarvis-super-intelligence/backend:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/ndichiv-spec/jarvis-super-intelligence/frontend:sha-${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library

  deploy:
    name: Deploy verified image to production host
    needs: [publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.JARVIS_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Configure pinned SSH access
        env:
          DEPLOY_KEY: ${{ secrets.JARVIS_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.JARVIS_DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.JARVIS_DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_HOST"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/jarvis_deploy_key"
          chmod 600 "$HOME/.ssh/jarvis_deploy_key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -F "$DEPLOY_HOST" -f "$HOME/.ssh/known_hosts" >/dev/null
      - name: Validate deployment target
        env:
          DEPLOY_HOST: ${{ vars.JARVIS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.JARVIS_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.JARVIS_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*[A-Za-z0-9]$ ]]
          [[ "$DEPLOY_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]]
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]
          [[ "$DEPLOY_PATH" != *"/../"* && "$DEPLOY_PATH" != */.. ]]
      - name: Fetch exact source revision and deploy
        env:
          DEPLOY_HOST: ${{ vars.JARVIS_DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.JARVIS_DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.JARVIS_DEPLOY_PATH }}
          BUILD_TIME: ${{ needs.publish.outputs.build_time }}
          GIT_SHA: ${{ github.sha }}
          DEPLOYMENT_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/jarvis_deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "git -C '$DEPLOY_PATH' status --porcelain --untracked-files=no | grep -q . && { echo 'Deployment checkout has tracked changes; refusing to overwrite.' >&2; exit 1; }; git -C '$DEPLOY_PATH' fetch --no-tags origin '$GIT_SHA' && git -C '$DEPLOY_PATH' checkout --detach '$GIT_SHA' && cd '$DEPLOY_PATH' && bash ./deployment/production/deploy.sh 'sha-$GIT_SHA' '$GIT_SHA' '$BUILD_TIME' '$DEPLOYMENT_ID'"
