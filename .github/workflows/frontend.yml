name: Frontend CI

# Regression guard for the canonical Next.js frontend.
# Runs the static checks that are green in this workspace today:
#   - tsc --noEmit        (type-check)
#   - vitest run            (unit regression tests)
# The full lint baseline (937 problems, dominated by no-explicit-any) is NOT
# enforced here (see AUDIT.md FRONTEND-1); only *touched* files are lint-clean.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _tier1/canonical_repo/platform/frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: _tier1/canonical_repo/platform/frontend/web/package-lock.json
      - run: npm ci
      - run: node_modules/.bin/tsc --noEmit
      - run: node_modules/.bin/vitest run
