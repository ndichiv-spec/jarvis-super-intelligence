name: Audit Guard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  audit-guard:
    name: Audit regression guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned root manifest (AUDIT.md P2-3): requirements-dev.txt (runtime +
      # pytest). Ad-hoc installs are no longer used.
      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-dev.txt
      - name: Run audit guard
        run: python -m pytest tests/test_audit_guard.py -q
