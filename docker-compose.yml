# JARVIS integration/local stack.
# This stack is not a public production deployment: use
# deployment/production/docker-compose.prod.yml for public HTTPS deployment.
#
# Usage:
#   cp .env.example .env
#   docker compose up -d
#
# Services:
#   - jarvis-backend    FastAPI REST + gRPC + MCP on ports 8000, 50051
#   - silverwing-runtime  LLM inference runtime on port 8010
#   - postgres          Primary database (data, sessions, conversations, audit)
#   - redis             Cache, session store, event bus, agent graph
#   - otel-collector    OpenTelemetry trace/metric collection
#   - prometheus        Metrics scraping from OTLP collector
#   - grafana           Dashboards (optional, expose with care)
#   - nginx             TLS termination + reverse proxy + rate limiting
#   - bubblewrap        (optional) bwrap for sandboxed tool execution inside containers

services:
  # =========================================================================
  # JARVIS Backend (FastAPI + gRPC + MCP)
  # =========================================================================
  jarvis:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis/backend:3.0.0
    container_name: jarvis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - JARVIS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jarvis_db
      - DB_USER=jarvis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
      - PROMETHEUS_MULTIPROC_DIR=/tmp/prometheus
      - JARVIS_BIO_GROWTH_WORKER_ENABLED=true
      - JARVIS_BIO_GROWTH_WORKER_MODE=celery
      - JARVIS_BIO_GROWTH_POLL_SECONDS=3600
    depends_on:
      - postgres
      - redis
      - otel-collector
    volumes:
      - jarvis_data:/app/data
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - jarvis-net
      - otel-net

  # =========================================================================
  # Durable background job queue (isolated from the evicting cache Redis)
  # =========================================================================
  redis-queue:
    image: redis:7-alpine
    container_name: jarvis-redis-queue
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_queue_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - jarvis-net

  jarvis-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis/backend:3.0.0
    container_name: jarvis-worker
    restart: unless-stopped
    command:
      - celery
      - -A
      - jarvis_backend.celery_app:celery_app
      - worker
      - --loglevel=INFO
      - --queues=research,commands
      - --concurrency=1
      - --max-tasks-per-child=50
    env_file: .env
    environment:
      - JARVIS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jarvis_db
      - DB_USER=jarvis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - JARVIS_BIO_GROWTH_WORKER_ENABLED=true
      - JARVIS_BIO_GROWTH_WORKER_MODE=celery
      - JARVIS_BIO_GROWTH_POLL_SECONDS=3600
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      redis-queue:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - jarvis_data:/app/data
    networks:
      - jarvis-net
      - otel-net

  jarvis-beat:
    build:
      context: .
      dockerfile: Dockerfile
    image: jarvis/backend:3.0.0
    container_name: jarvis-beat
    restart: unless-stopped
    command:
      - celery
      - -A
      - jarvis_backend.celery_app:celery_app
      - beat
      - --loglevel=INFO
      - --schedule=/app/data/celerybeat-schedule
    env_file: .env
    environment:
      - JARVIS_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=jarvis_db
      - DB_USER=jarvis
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis-queue:6379/0
      - JARVIS_BIO_GROWTH_WORKER_ENABLED=true
      - JARVIS_BIO_GROWTH_WORKER_MODE=celery
      - JARVIS_BIO_GROWTH_POLL_SECONDS=3600
    depends_on:
      redis-queue:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - jarvis_data:/app/data
    networks:
      - jarvis-net

  # =========================================================================
  # Silverwing AI Runtime (LLM inference)
  # =========================================================================
  silverwing:
    build:
      context: ./silverwing-backend
      dockerfile: Dockerfile
    image: jarvis/silverwing:3.0.0
    container_name: silverwing-runtime
    restart: unless-stopped
    env_file: .env
    environment:
      - JARVIS_ENV=production
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4317
    depends_on:
      - jarvis
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jarvis-net
      - otel-net

  # =========================================================================
  # PostgreSQL (primary database)
  # =========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis_db
      POSTGRES_USER: ${DB_USER:-jarvis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD for this local stack}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jarvis} -d jarvis_db"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jarvis-net

  # =========================================================================
  # Redis (caching, session store, event bus, agent graph)
  # =========================================================================
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - jarvis-net

  # =========================================================================
  # OpenTelemetry Collector (trace + metric aggregation)
  # =========================================================================
  otel-collector:
    image: otel/opentelemetry-collector:0.104.0
    container_name: jarvis-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./docker/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://tempo:4317
    depends_on:
      - tempo
    networks:
      - otel-net

  # =========================================================================
  # Tempo (distributed trace storage)
  # =========================================================================
  tempo:
    image: grafana/tempo:2.5.0
    container_name: jarvis-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo-config.yaml"]
    volumes:
      - ./docker/tempo-config.yaml:/etc/tempo-config.yaml:ro
      - tempo_data:/tempo
    networks:
      - otel-net

  # =========================================================================
  # Prometheus (metrics scraping)
  # =========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: jarvis-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
    depends_on:
      - otel-collector
    networks:
      - otel-net

  # =========================================================================
  # Grafana (dashboards)
  # =========================================================================
  grafana:
    image: grafana/grafana:10.4.0
    container_name: jarvis-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on:
      - prometheus
      - tempo
    networks:
      - otel-net

  # =========================================================================
  # Nginx (reverse proxy, TLS termination, rate limiting)
  # =========================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: jarvis-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/certs:/etc/nginx/certs:ro
      - ./docker/html:/usr/share/nginx/html:ro
    depends_on:
      - jarvis
    networks:
      - jarvis-net

networks:
  jarvis-net:
    driver: bridge
  otel-net:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  redis_queue_data:
  jarvis_data:
  tempo_data:
  prometheus_data:
  grafana_data:
