events {
    worker_processes auto;
}

http {
    # Rate limiting (matches Claude Code's permission model boundaries)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=1r/m;

    # Upstream: JARVIS backend (FastAPI REST + gRPC + MCP)
    upstream jarvis_backend {
        server jarvis:8000;
        keepalive 32;
    }

    # TLS settings (self-signed for private deployment)
    server {
        listen 80;
        server_name _;
        # Redirect HTTP -> HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name _;

        # Self-signed certificate (replace with real cert for production)
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript;

        # JARVIS API (REST)
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://jarvis_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_read_timeout 120s;
        }

        # MCP endpoint
        location /mcp {
            proxy_pass http://jarvis_backend;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header X-Request-ID $request_id;
        }

        # Health check (no rate limit)
        location /health {
            proxy_pass http://jarvis_backend;
            proxy_set_header X-Request-ID $request_id;
        }

        # Default: serve static files (frontend built output)
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }
    }
}
