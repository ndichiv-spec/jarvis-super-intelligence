# ============================================================
# JARVIS Cloud Docker Compose Template
# Stripped-down for cloud deployment (no local storage deps)
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: jarvis-backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-JARVIS Super AI}
      - APP_VERSION=${APP_VERSION:-3.0.0}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
