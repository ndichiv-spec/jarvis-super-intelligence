# ============================================================
# JARVIS Hybrid Docker Compose Template
# Local core services + cloud-managed AI providers
# ============================================================

services:
  backend:
    build:
      context: .
      dockerfile: deployment/Dockerfile.backend
    container_name: jarvis-backend
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - APP_NAME=${APP_NAME:-JARVIS Super AI}
      - APP_VERSION=${APP_VERSION:-3.0.0}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-jarvis}:${DB_PASSWORD:-jarvis_password}@db:5432/${DB_NAME:-jarvis}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_password}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:15-alpine
    container_name: jarvis-db
    environment:
      - POSTGRES_USER=${DB_USER:-jarvis}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-jarvis_password}
      - POSTGRES_DB=${DB_NAME:-jarvis}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jarvis}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 512mb
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - jarvis-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:

networks:
  jarvis-network:
    driver: bridge
