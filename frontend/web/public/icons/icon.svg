<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="JARVIS">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7df9ff"/>
      <stop offset="45%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00e5a0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#00e5a0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="#030712"/>

  <!-- outer containment ring -->
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ring)" stroke-width="10" opacity="0.55" filter="url(#glow)"/>

  <!-- segmented mid ring -->
  <g stroke="url(#ring)" stroke-width="14" stroke-linecap="round" opacity="0.9" filter="url(#glow)">
    <path d="M256 96 A160 160 0 0 1 394.5 176"/>
    <path d="M394.5 336 A160 160 0 0 1 256 416"/>
    <path d="M256 416 A160 160 0 0 1 117.5 336"/>
    <path d="M117.5 176 A160 160 0 0 1 256 96"/>
  </g>

  <!-- inner housing -->
  <circle cx="256" cy="256" r="104" fill="#030712" stroke="#00d4ff" stroke-width="6" opacity="0.95"/>

  <!-- reactor core -->
  <circle cx="256" cy="256" r="62" fill="url(#core)" opacity="0.28" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="42" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="20" fill="#eaffff" opacity="0.95"/>

  <!-- cardinal ticks -->
  <g stroke="#00d4ff" stroke-width="8" stroke-linecap="round" opacity="0.8">
    <line x1="256" y1="34" x2="256" y2="70"/>
    <line x1="256" y1="442" x2="256" y2="478"/>
    <line x1="34" y1="256" x2="70" y2="256"/>
    <line x1="442" y1="256" x2="478" y2="256"/>
  </g>
</svg>