name: jarvis-production

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 256mb

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/usr/local/bin/redis-entrypoint.sh"]
    secrets:
      - redis_password
    volumes:
      - redis_data:/data
      - ./redis-entrypoint.sh:/usr/local/bin/redis-entrypoint.sh:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/redis_password)\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  migrate:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile.backend
    image: jarvis-backend:${JARVIS_VERSION:-local}
    restart: "no"
    command: ["python", "scripts/migrate_persistence.py", "--seed"]
    environment:
      JARVIS_ENV: production
      JARVIS_SECRET_KEY_FILE: /run/secrets/jarvis_secret_key
      JARVIS_ADMIN_EMAIL: ${JARVIS_ADMIN_EMAIL:?Set JARVIS_ADMIN_EMAIL}
      JARVIS_ADMIN_PASSWORD_FILE: /run/secrets/jarvis_admin_password
      JARVIS_REQUIRE_PREMIGRATED_SCHEMA: "0"
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - jarvis_secret_key
      - jarvis_admin_password
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    build:
      context: ../..
      dockerfile: deployment/production/Dockerfile.backend
    image: jarvis-backend:${JARVIS_VERSION:-local}
    restart: unless-stopped
    init: true
    environment:
      JARVIS_ENV: production
      JARVIS_SECRET_KEY_FILE: /run/secrets/jarvis_secret_key
      JARVIS_ADMIN_EMAIL: ${JARVIS_ADMIN_EMAIL:?Set JARVIS_ADMIN_EMAIL}
      JARVIS_ADMIN_PASSWORD_FILE: /run/secrets/jarvis_admin_password
      JARVIS_REQUIRE_PREMIGRATED_SCHEMA: "1"
      JARVIS_CORS_ORIGINS: https://${DOMAIN:?Set DOMAIN}
      DATABASE_URL_FILE: /run/secrets/database_url
      REDIS_URL_FILE: /run/secrets/redis_url
      JARVIS_VERSION: ${JARVIS_VERSION:-0.0.0}
      GIT_SHA: ${GIT_SHA:-unknown}
      BUILD_TIME: ${BUILD_TIME:-unknown}
      ENVIRONMENT: production
      DEPLOYMENT_ID: ${DEPLOYMENT_ID:-manual}
    secrets:
      - jarvis_secret_key
      - jarvis_admin_password
      - database_url
      - redis_url
    volumes:
      - jarvis_data:/app/jarvis_data
      - jarvis_uploads:/app/jarvis_uploads
    networks:
      - edge
      - data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 3g
    cpus: 2.0
    stop_grace_period: 40s

  frontend:
    build:
      context: ../../frontend/web
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?Set NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_VERSION: ${JARVIS_VERSION:-0.0.0}
    image: jarvis-frontend:${JARVIS_VERSION:-local}
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    networks:
      - edge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    mem_limit: 1g
    cpus: 1.0
    stop_grace_period: 30s

  caddy:
    image: caddy:2.10.0-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    cpus: 0.5
    stop_grace_period: 30s

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - data
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    cpus: 0.5

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:
  jarvis_data:
  jarvis_uploads:
  caddy_data:
  caddy_config:
  prometheus_data:

secrets:
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE_SOURCE:?Set POSTGRES_PASSWORD_FILE_SOURCE}
  redis_password:
    file: ${REDIS_PASSWORD_FILE_SOURCE:?Set REDIS_PASSWORD_FILE_SOURCE}
  jarvis_secret_key:
    file: ${JARVIS_SECRET_KEY_FILE_SOURCE:?Set JARVIS_SECRET_KEY_FILE_SOURCE}
  jarvis_admin_password:
    file: ${JARVIS_ADMIN_PASSWORD_FILE_SOURCE:?Set JARVIS_ADMIN_PASSWORD_FILE_SOURCE}
  database_url:
    file: ${DATABASE_URL_FILE_SOURCE:?Set DATABASE_URL_FILE_SOURCE}
  redis_url:
    file: ${REDIS_URL_FILE_SOURCE:?Set REDIS_URL_FILE_SOURCE}
