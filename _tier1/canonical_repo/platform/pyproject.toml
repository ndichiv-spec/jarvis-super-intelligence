[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "pytest-benchmark>=4.0.0",
    "locust>=2.31.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.1.0",
    "radon>=6.0.0",
    "bandit>=1.8.0",
    "safety>=3.2.0",
    "pip-licenses>=5.0.0",
    "commitizen>=4.4.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
minrequiredcoverage = 70

[tool.coverage.run]
source = ["infrastructure", "performance"]
omit = ["*/test_*", "*/tests/*", "*/.git/*", "*/venv/*", "*/__pycache__/*", "*.pyc"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == \"__main__\":",
    "raise NotImplementedError",
    "pass",
    "def __repr__",
    "@abc.abstractmethod",
    "@abstractmethod",
]
fail_under = 70

[tool.coverage.html]
directory = "coverage_html"

[tool.coverage.xml]
output = "coverage.xml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # flake8-unused-arguments
    "RUF", # ruff-specific
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B904",  # raise without from inside except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802", "N803", "N806", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_strict_optional = true
exclude = [
    "venv/",
    ".venv/",
    "tests/",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "scm"
major_version_zero = true
